server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: notification_user
    password: ${NOTIFICATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-service
      # Un grupo nuevo lee los tópicos desde el principio: ningún evento anterior se pierde.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # El evento se confirma solo después de aplicarlo; si falla, el manejador de errores decide.
      ack-mode: manual_immediate
    # Notification no publica eventos: el productor solo escribe en los tópicos de mensajes muertos.
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: geops-identity
          audiences: geops-api

geops:
  messaging:
    enabled: ${GEOPS_MESSAGING_ENABLED:true}

# US34: cinco fallos de FCM o del servidor de correo en diez segundos abren su circuito 30 s. Con el de FCM abierto
# el aviso pasa al resumen por correo; con el de correo abierto el resumen queda para la siguiente vuelta y el aviso
# de un reporte se reintenta sin descartar el evento. Un bulkhead lleno es saturación propia, no una caída.
resilience4j:
  circuitbreaker:
    configs:
      provider:
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        ignore-exceptions:
          - io.github.resilience4j.bulkhead.BulkheadFullException
    instances:
      fcm:
        base-config: provider
      smtp:
        base-config: provider
  # Llamadas en vuelo por proveedor; la siguiente se corta al instante en vez de esperar un hueco.
  bulkhead:
    instances:
      fcm:
        max-concurrent-calls: 10
        max-wait-duration: 0
      smtp:
        max-concurrent-calls: 5
        max-wait-duration: 0

management:
  # Actuator en su propio puerto, que compose no publica y el gateway no enruta (igual que Catalog).
  server:
    port: ${MANAGEMENT_PORT:9085}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
geops:
  notifications:
    unsubscribe-secret: ${NOTIFICATION_UNSUBSCRIBE_SECRET}

---
spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 2000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
geops:
  notifications:
    email-from: ${NOTIFICATION_EMAIL_FROM:avisos@geops.local}
    email-window: ${NOTIFICATION_EMAIL_WINDOW:60m}
    web-base-url: ${WEB_BASE_URL:http://localhost:4200}

---
geops:
  notifications:
    fcm-credentials-path: ${FCM_CREDENTIALS_PATH:}
