server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: catalog-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: catalog_user
    password: ${CATALOG_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
    out-of-order: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # QAS02: a Redis that does not answer in 200 ms counts as a cache miss and the search goes to PostgreSQL.
      timeout: 200ms
      connect-timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: catalog-service
      # A new group reads identity.events from the start: no BusinessVerified written before is lost.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # The event is acknowledged only after the standing is committed and its cells deleted.
      ack-mode: manual_immediate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: geops-identity
          audiences: geops-api

geops:
  messaging:
    enabled: ${GEOPS_MESSAGING_ENABLED:true}
  events:
    identity-topic: identity.events
  cache:
    # false: the search goes straight to PostgreSQL with the radius query of Sprint 1.
    enabled: ${GEOPS_CACHE_ENABLED:true}
    cell-ttl: 10m
    # After a Redis error the search skips Redis for this long instead of waiting its timeout on every request.
    pause-after-failure: 5s
  expiration:
    delay: 5m
  geocoding:
    # Retries the offers left PENDING because Nominatim did not answer.
    delay: 30m
  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Política de uso de Nominatim (E2-15): User-Agent con correo de contacto y una petición por segundo.
    contact-email: ${NOMINATIM_CONTACT_EMAIL:}
    timeout: 2s
    min-interval: 1s

# S2-03: abre con cinco fallos en diez segundos y queda abierto 30 s; mientras tanto las ofertas siguen PENDING.
resilience4j:
  circuitbreaker:
    instances:
      nominatim:
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1

management:
  # F2: actuator on its own port, not published by compose nor routed by the gateway.
  server:
    port: ${MANAGEMENT_PORT:9082}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.95
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
