server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: identity_user
    password: ${IDENTITY_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  task:
    scheduling:
      # La carga del padrón puede tardar minutos; con tres hilos no frena el relay ni los reintentos.
      pool:
        size: 3

geops:
  security:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
      issuer: geops-identity
      audience: geops-api
  sunat:
    # file: lee geops.sunat.file (pruebas y demo). url: descarga el padrón reducido de SUNAT.
    source: ${GEOPS_SUNAT_SOURCE:file}
    url: ${GEOPS_SUNAT_URL:http://www2.sunat.gob.pe/padron_reducido_ruc.zip}
    file: ${GEOPS_SUNAT_FILE:classpath:sunat/padron-muestra.txt}
    schedule-enabled: ${GEOPS_SUNAT_SCHEDULE_ENABLED:true}
    ubigeo-prefixes: 1501,0701
    charset: ISO-8859-1
    separator: "|"
    # Posición (desde 0) de cada campo en una línea del padrón. Si SUNAT cambia el orden, solo cambia esto.
    columns:
      ruc: 0
      business-name: 1
      status: 2
      condition: 3
      ubigeo: 4

  nominatim:
    base-url: ${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
    # Política de uso de Nominatim (E2-15): User-Agent con correo de contacto y una petición por segundo.
    contact-email: ${NOMINATIM_CONTACT_EMAIL:}
    timeout: 2s
    min-interval: 1s

# S2-03: abre con cinco fallos en diez segundos y queda abierto 30 s; mientras tanto la verificación queda PENDING.
resilience4j:
  circuitbreaker:
    instances:
      nominatim:
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
