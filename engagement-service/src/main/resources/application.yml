server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: engagement-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/engagement_db}
    username: engagement_user
    password: ${ENGAGEMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: engagement-service
      # Un grupo nuevo lee los tópicos desde el principio: ningún evento anterior se pierde.
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # El evento se confirma solo después de aplicarlo; si falla, el manejador de errores decide.
      ack-mode: manual_immediate
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Con Kafka caído el envío falla en segundos y el relay deja la fila para la siguiente vuelta.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: geops-identity
          audiences: geops-api

geops:
  messaging:
    enabled: ${GEOPS_MESSAGING_ENABLED:true}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    send-timeout-ms: 5000
    # Intentos con Kafka respondiendo antes de marcar la fila FAILED; una caída de Kafka no los agota.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    topic: engagement.events

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
