server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: reservation-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: reservation_user
    password: ${RESERVATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Con Kafka caído el envío falla en segundos y el relay deja la fila para la siguiente vuelta.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: geops-identity
          audiences: geops-api

geops:
  catalog:
    base-url: ${CATALOG_INTERNAL_URL:http://localhost:8082}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    send-timeout-ms: 5000
    # Intentos con Kafka respondiendo antes de marcar la fila FAILED; una caída de Kafka no los agota.
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
    topic: reservation.events
  reports:
    # Plazo del comercio para responder un reporte (S3-08) y cada cuánto se revisan los plazos vencidos.
    response-window: 48h
    deadline-check-ms: ${REPORTS_DEADLINE_CHECK_MS:300000}
    scheduler-enabled: ${REPORTS_SCHEDULER_ENABLED:true}

# US34: cinco fallos de Catalog en diez segundos abren el circuito 15 s; mientras tanto la reserva responde
# CATALOG_UNAVAILABLE (503) sin esperar a Catalog. Una oferta inexistente o vencida es una respuesta, no un fallo,
# y un bulkhead lleno es saturación propia, no una caída de Catalog.
resilience4j:
  circuitbreaker:
    instances:
      catalog:
        sliding-window-type: TIME_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 100
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 1
        ignore-exceptions:
          - com.geopslabs.geops.reservation.domain.models.exceptions.OfferNotFoundException
          - com.geopslabs.geops.reservation.domain.models.exceptions.OfferNotAvailableException
          - io.github.resilience4j.bulkhead.BulkheadFullException
  # Como mucho 25 reservas esperan a Catalog a la vez; la siguiente recibe 503 al instante en vez de hacer cola.
  bulkhead:
    instances:
      catalog:
        max-concurrent-calls: 25
        max-wait-duration: 0

management:
  # Actuator en su propio puerto, que compose no publica y el gateway no enruta (igual que Catalog).
  server:
    port: ${MANAGEMENT_PORT:9083}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers

springdoc:
  swagger-ui:
    path: /swagger-ui.html
