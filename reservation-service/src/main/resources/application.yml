server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: reservation-service
  config:
    import: optional:file:../platform/.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reservation_db}
    username: reservation_user
    password: ${RESERVATION_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # Con Kafka caído el envío falla en segundos y el relay deja la fila para la siguiente vuelta.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: geops-identity
          audiences: geops-api

geops:
  catalog:
    base-url: ${CATALOG_INTERNAL_URL:http://localhost:8082}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}
    batch-size: 100
    send-timeout-ms: 5000
    topic: reservation.events

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
