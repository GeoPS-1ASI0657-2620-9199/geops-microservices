name: geops

x-service: &service
  profiles: [app]
  restart: unless-stopped
  env_file: .env
  mem_limit: 512m
  environment: &service-env
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REDIS_HOST: redis
  depends_on: &service-deps
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy

x-health: &health
  interval: 15s
  start_period: 60s
  retries: 5

services:
  postgres:
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD}
      RESERVATION_DB_PASSWORD: ${RESERVATION_DB_PASSWORD}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/20-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      retries: 10

  identity-service:
    <<: *service
    build: ../identity-service
    environment:
      <<: *service-env
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt-public.pem
    volumes:
      - ./keys:/run/keys:ro
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]

  catalog-service:
    <<: *service
    build: ../catalog-service
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog_db
    depends_on:
      <<: *service-deps
      redis:
        condition: service_healthy
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]

  reservation-service:
    <<: *service
    build: ../reservation-service
    environment:
      <<: *service-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/reservation_db
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]

  engagement-service:
    <<: *service
    build: ../engagement-service
    environment:
      <<: *service-env
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/engagement_db
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]

  notification-service:
    <<: *service
    build: ../notification-service
    environment:
      <<: *service-env
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]

  gateway:
    image: nginx:1.27
    profiles: [app]
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - identity-service
      - catalog-service
      - reservation-service
      - engagement-service
      - notification-service

volumes:
  postgres-data:
  kafka-data:
