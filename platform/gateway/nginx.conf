resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

map $http_origin $cors_origin {
    default "";
    "http://localhost:4200" $http_origin;
    "~^https://[a-z0-9-]+\.vercel\.app$" $http_origin;
    "~^https://[a-z0-9-]+\.netlify\.app$" $http_origin;
}

server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /_introspect {
        internal;
        set $identity identity-service:8081;
        proxy_pass http://$identity/api/v1/auth/introspect;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    location /api/v1/auth/ {
        limit_req zone=api burst=20 nodelay;
        set $upstream identity-service:8081;
        proxy_pass http://$upstream;
    }

    location ~ ^/api/v1/(users|business-profiles|consumer-profiles)(/|$) {
        limit_req zone=api burst=40 nodelay;
        set $upstream identity-service:8081;
        proxy_pass http://$upstream;
    }

    location ~ ^/api/v1/(offers|campaigns|admin)(/|$) {
        limit_req zone=api burst=40 nodelay;
        set $upstream catalog-service:8082;
        proxy_pass http://$upstream;
    }

    location ~ ^/api/v1/reservations(/|$) {
        limit_req zone=api burst=40 nodelay;
        set $upstream reservation-service:8083;
        proxy_pass http://$upstream;
    }

    location ~ ^/api/v1/(saved-offers|reviews|follows)(/|$) {
        limit_req zone=api burst=40 nodelay;
        set $upstream engagement-service:8084;
        proxy_pass http://$upstream;
    }

    location ~ ^/api/v1/(notifications|notification-preferences|locations)(/|$) {
        limit_req zone=api burst=40 nodelay;
        set $upstream notification-service:8085;
        proxy_pass http://$upstream;
    }
}
