add_header Access-Control-Allow-Origin $cors_origin always;
add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

if ($request_method = OPTIONS) {
    return 204;
}

proxy_set_header Host $host;
proxy_set_header X-Correlation-ID $correlation_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# US27: toda ruta exige un token activo antes de llegar al servicio, salvo las que llevan
# "auth_request off" (o /_introspect_unless_read). Una ruta nueva queda protegida por omisión.
# Los servicios siguen validando el JWT por su cuenta.
auth_request /_introspect;
error_page 401 = @unauthorized;

# Validación del token en identity (US26). La respuesta se guarda 5 s por token: la mayoría de las
# peticiones no llega a identity y un token cerrado con logout deja de pasar en 5 s como mucho.
location = /_introspect {
    internal;
    if ($http_authorization = "") {
        return 401;
    }
    set $identity identity-service:8081;
    proxy_pass http://$identity/api/v1/auth/introspect;
    proxy_method POST;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_cache introspect;
    proxy_cache_key $http_authorization;
    proxy_cache_valid 200 401 5s;
    proxy_cache_lock on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
}

# Lectura pública, escritura con token: GET y HEAD pasan sin validar.
location = /_introspect_unless_read {
    internal;
    if ($request_method ~ ^(GET|HEAD)$) {
        return 204;
    }
    rewrite ^ /_introspect last;
}

location @unauthorized {
    default_type application/json;
    return 401 '{"code":"UNAUTHORIZED","message":"Inicia sesión para continuar."}';
}

location / {
    auth_request off;
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"Esa ruta no existe."}';
}

location = /.well-known/jwks.json {
    auth_request off;
    limit_req zone=api burst=20 nodelay;
    set $upstream identity-service:8081;
    proxy_pass http://$upstream;
}

# Rutas públicas de identity. introspect es interna: solo la pide el gateway.
location ~ ^/api/v1/auth/(login|register|refresh|email-confirmations)$ {
    auth_request off;
    limit_req zone=api burst=20 nodelay;
    set $upstream identity-service:8081;
    proxy_pass http://$upstream;
}

location = /api/v1/auth/introspect {
    auth_request off;
    default_type application/json;
    return 404 '{"code":"NOT_FOUND","message":"Esa ruta no existe."}';
}

location /api/v1/auth/ {
    limit_req zone=api burst=20 nodelay;
    set $upstream identity-service:8081;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/(users|business-profiles|consumer-profiles)(/|$) {
    limit_req zone=api burst=40 nodelay;
    set $upstream identity-service:8081;
    proxy_pass http://$upstream;
}

# Búsqueda, detalle, categorías y fotos de ofertas se leen sin sesión (la web las pide anónima).
location ~ ^/api/v1/offers(/|$) {
    auth_request /_introspect_unless_read;
    limit_req zone=api burst=40 nodelay;
    set $upstream catalog-service:8082;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/(offers|campaigns|admin)(/|$) {
    limit_req zone=api burst=40 nodelay;
    set $upstream catalog-service:8082;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/(reservations|reports)(/|$) {
    limit_req zone=api burst=40 nodelay;
    set $upstream reservation-service:8083;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/(saved-offers|saved-businesses|reviews|follows)(/|$) {
    limit_req zone=api burst=40 nodelay;
    set $upstream engagement-service:8084;
    proxy_pass http://$upstream;
}

# Enlace de baja del correo: lo abre quien no tiene sesión; el token de baja va en el cuerpo.
location = /api/v1/email-unsubscriptions {
    auth_request off;
    limit_req zone=api burst=20 nodelay;
    set $upstream notification-service:8085;
    proxy_pass http://$upstream;
}

location ~ ^/api/v1/(notifications|notification-preferences|locations|push-subscriptions|email-unsubscriptions)(/|$) {
    limit_req zone=api burst=40 nodelay;
    set $upstream notification-service:8085;
    proxy_pass http://$upstream;
}

location /docs/identity/ {
    auth_request off;
    set $upstream identity-service:8081;
    rewrite ^/docs/identity/(.*)$ /$1 break;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /docs/identity/$1;
    absolute_redirect off;
    sub_filter_types application/json application/javascript text/javascript;
    sub_filter_once off;
    sub_filter '"/v3/api-docs' '"/docs/identity/v3/api-docs';
    sub_filter '"url":"http://' '"url":"$scheme://';
    proxy_pass http://$upstream;
}

