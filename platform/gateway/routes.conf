location = / {
    auth_request off;
    default_type text/html;
    return 200 '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>GeoPS API</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#1f2937}a{color:#0b6bcb}li{margin:6px 0}code{background:#f3f4f6;padding:2px 4px}</style></head><body><h1>GeoPS API</h1><p>Gateway de los microservicios de GeoPS.</p><h2>Documentación</h2><ul><li><a href="/docs/identity/swagger-ui.html">Identity Service</a></li><li><a href="/docs/catalog/swagger-ui.html">Catalog Service</a></li><li><a href="/docs/reservation/swagger-ui.html">Reservation Service</a></li><li><a href="/docs/engagement/swagger-ui.html">Engagement Service</a></li><li><a href="/docs/notification/swagger-ui.html">Notification Service</a></li></ul><h2>Ejemplo</h2><p><a href="/api/v1/offers/nearby?lat=-12.0697&lng=-77.0240&radiusMinutes=10">Ofertas a 10 minutos a pie de La Victoria</a></p></body></html>';
}
