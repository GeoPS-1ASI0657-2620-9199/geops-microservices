# Gateway de la prueba de carga (US14, QAS02). Igual a nginx.conf salvo el límite de la ruta de ofertas.
# Se usa en local (C2-02) con docker-compose.loadtest.yml y se retira al terminar.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Solo durante la prueba de carga QAS02 (30 a 300 peticiones/s), y solo para la ruta de ofertas.
limit_req_zone $binary_remote_addr zone=offers_loadtest:10m rate=400r/s;
limit_req_status 429;

# $upstream_addr muestra qué réplica atendió cada petición (US17).
log_format upstream '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';

map $http_origin $cors_origin {
    default "";
    "http://localhost:4200" $http_origin;
    "~^https://[a-z0-9-]+\.vercel\.app$" $http_origin;
    "~^https://[a-z0-9-]+\.netlify\.app$" $http_origin;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ^~ gana a las rutas con expresión regular de routes.conf: solo esta ruta cambia de límite.
    location ^~ /api/v1/offers {
        limit_req zone=offers_loadtest burst=200 nodelay;
        set $upstream catalog-service:8082;
        proxy_pass http://$upstream;
    }

    include /etc/nginx/geops/routes.conf;
}
