resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

map $http_origin $cors_origin {
    default "";
    "http://localhost:4200" $http_origin;
    "~^https://[a-z0-9-]+\.vercel\.app$" $http_origin;
    "~^https://[a-z0-9-]+\.netlify\.app$" $http_origin;
}

server {
    listen 80;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/geops/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geops/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/geops/routes.conf;
}
