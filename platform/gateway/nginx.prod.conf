include /etc/nginx/geops/http-common.conf;

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    access_log /var/log/nginx/access.log upstream;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/geops/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geops/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/geops/routes.conf;
}
