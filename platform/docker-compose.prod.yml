x-deps-identity: &deps-identity
  postgres:
    condition: service_healthy
  identity-service:
    condition: service_healthy

# Redis, Kafka y kafka-init viven en el perfil messaging. Los servicios no esperan a Kafka:
# la bandeja de salida guarda los eventos hasta que el broker responde.
services:
  postgres:
    ports: !reset []

  redis:
    profiles: [messaging]
    ports: !reset []

  kafka:
    profiles: [messaging]
    ports: !reset []

  # Desde el Sprint 2 el despliegue enciende este perfil: --profile app --profile messaging.
  kafka-init:
    profiles: !override [messaging]

  identity-service:
    depends_on: !override
      postgres:
        condition: service_healthy

  catalog-service:
    depends_on: !override
      <<: *deps-identity

  reservation-service:
    depends_on: !override
      <<: *deps-identity

  engagement-service:
    depends_on: !override
      <<: *deps-identity

  notification-service:
    depends_on: !override
      <<: *deps-identity

  gateway:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
